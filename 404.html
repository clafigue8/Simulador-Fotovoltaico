<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Simulador Fotovoltaico</title>
<link rel="icon" type="image/png" href="/assets/img/favicon-48.png">
<style>
:root{--bg:#f4f6fa;--ink:#13233f;--muted:#5b6475;--card:#fff;--line:#dde3ec;--pri:#1d3b6e;--acc:#c98a1b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1726;--ink:#e8eef8;--muted:#9aa6ba;--card:#16213a;--line:#25324d;--pri:#7fa6e6;--acc:#e3a63c}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 28px;max-width:440px;text-align:center;box-shadow:0 10px 30px rgba(20,40,80,.08)}
img{width:72px;height:72px;border-radius:16px}h1{font-size:26px;margin:18px 0 6px}p{color:var(--muted);margin:0 0 22px}
.n{font-size:13px;letter-spacing:2px;color:var(--acc);font-weight:700}
a{display:inline-block;background:var(--pri);color:#fff;text-decoration:none;padding:11px 22px;border-radius:10px;font-weight:600}
@media (prefers-color-scheme:dark){a{color:#0f1726}}
</style>
</head>
<body>
<div class="c">
<img src="/assets/img/icon-192.png" alt="">
<div class="n">ERROR 404</div>
<h1>No encontramos esta página</h1>
<p>Puede que la dirección esté mal escrita o que la página ya no exista.<br><small>Page not found.</small></p>
<a href="/">Ir al simulador</a>
</div>
</body>
</html>
